<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Offline</title>
<style>
  :root { --bg:#FAFAFA; --fg:#0E0E10; --muted:#8A8A8F; --accent:#5E44A0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0E0E10; --fg:#FAFAFA; --muted:#8A8A8F; --accent:#8B6BD8; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,"Roboto","Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 28px; text-align:center; }
  .owl { width:96px; height:96px; margin-bottom:24px; opacity:0.9; }
  h1 { font-size:22px; font-weight:700; margin:0 0 12px; letter-spacing:-0.01em; }
  p { font-size:15px; color:var(--muted); margin:0 0 28px; max-width:320px; line-height:1.5; }
  .retry {
    display:inline-block; padding:13px 28px; border-radius:24px;
    background:var(--accent); color:#fff; font-size:15px; font-weight:600;
    border:none; cursor:pointer; font-family:inherit;
  }
  .retry:active { opacity:0.85; }
</style>
</head>
<body>
  <div class="wrap">
    <img class="owl" src="ic_owl.png" alt="Search owl">
    <h1>You're offline</h1>
    <p>Sorry, Search can't load this page while you're offline. Check your connection and try again.</p>
    <button class="retry" onclick="if(window.SearchApp&&window.SearchApp.retry)window.SearchApp.retry();">Try again</button>
  </div>
<script>
  // Native pushes the accent in after load: these pages are assets, so their
  // colours are baked at author time and cannot follow a setting on their own.
  // The owl is a flat PNG, so it rotates hue rather than taking a colour - the
  // white eyes carry no hue to turn, so only the body moves.
  window.__setAccent = function(hex, hueShift){
    if (hex) document.documentElement.style.setProperty('--accent', hex);
    var owl = document.querySelector('.owl');
    if (owl && typeof hueShift === 'number' && hueShift) {
      owl.style.filter = 'hue-rotate(' + hueShift + 'deg)';
    }
  };
</script>
</body>
</html>
