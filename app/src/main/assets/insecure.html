<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Not secure</title>
<style>
  :root { --bg:#FAFAFA; --fg:#0E0E10; --muted:#8A8A8F; --accent:#5E44A0; --line:#E4E4E7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0E0E10; --fg:#FAFAFA; --muted:#8A8A8F; --accent:#8B6BD8; --line:#26262A; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,"Roboto","Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 28px; text-align:center; }
  .owl { width:96px; height:96px; margin-bottom:24px; opacity:0.9; }
  h1 { font-size:22px; font-weight:700; margin:0 0 12px; letter-spacing:-0.01em; }
  p { font-size:15px; color:var(--muted); margin:0 0 10px; max-width:340px; line-height:1.5; }
  .host { font-size:13px; color:var(--muted); margin:0 0 28px; max-width:320px;
    word-break:break-all; background:var(--line); padding:8px 14px; border-radius:10px; }
  .go {
    display:inline-block; padding:13px 28px; border-radius:24px;
    background:var(--accent); color:#fff; font-size:15px; font-weight:600;
    border:none; cursor:pointer; font-family:inherit; margin-bottom:14px;
  }
  .go:active { opacity:0.85; }
  .anyway { font-size:14px; color:var(--muted); background:none; border:none;
    font-family:inherit; text-decoration:underline; cursor:pointer; padding:8px; }
</style>
</head>
<body>
  <div class="wrap">
    <img class="owl" src="ic_owl.png" alt="Search owl">
    <h1>This site isn't secure</h1>
    <p>Search couldn't reach this site over a secure connection. Anything you
       send to it - passwords, messages, card numbers - could be read or changed
       on the way.</p>
    <div class="host" id="host"></div>
    <button class="go" onclick="history.back();">Go back</button>
    <button class="anyway"
      onclick="if(window.SearchApp&&window.SearchApp.continueInsecure)window.SearchApp.continueInsecure();">
      Continue anyway
    </button>
  </div>
<script>
  // The app appends ?u=<the http address> so the site can be named.
  try {
    var m = location.search.match(/[?&]u=([^&]+)/);
    if (m) document.getElementById('host').textContent = decodeURIComponent(m[1]);
    else document.getElementById('host').style.display='none';
  } catch(e){ document.getElementById('host').style.display='none'; }

  window.__setAccent = function(hex, hueShift) {
    if (hex) document.documentElement.style.setProperty('--accent', hex);
    var owl = document.querySelector('.owl');
    if (owl && typeof hueShift === 'number' && hueShift) {
      owl.style.filter = 'hue-rotate(' + hueShift + 'deg)';
    }
  };
</script>
</body>
</html>
