<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Search</title>
<style>
  :root {
    --bg:#F5F5F5; --fg:#0E0E10; --muted:#8A8A8F; --line:#E4E4E7;
    --field:#FFFFFF; --accent:#2B6CF0;
    --shadow:0 1px 3px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0E0E10; --fg:#FAFAFA; --muted:#8A8A8F; --line:#26262A;
      --field:#17171A; --accent:#4C8DFF;
      --shadow:0 1px 3px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.3);
    }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,"Roboto","Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  /* A headline or address with no space in it is wider than the phone, and one
     of those is enough to make the whole page slide sideways under the thumb.
     Nothing here is meant to scroll horizontally, so nothing may. */
  html, body { max-width:100%; overflow-x:hidden; }
  .wrap { min-height:100%; display:flex; flex-direction:column; align-items:center;
    padding:2.5vh 14px calc(40px + var(--adslot, 0px));
    transition:padding-top .15s ease; }

  .wordmark {
    font-size:clamp(50px, 13.5vw, 66px);
    font-weight:800;
    letter-spacing:-0.01em;
    margin:0 0 18px;
    color:var(--accent);
    text-shadow:0 4px 18px rgba(0,0,0,0.08);
  }

  /* The search pill — no icon, just the input. This is the working
     omnibox for the home page: SearchApp.submit() feeds straight into
     the same go() the native address bar uses everywhere else. */
  .field {
    width:100%; max-width:680px;
    display:flex; align-items:center; gap:10px;
    background:var(--field); border:1px solid var(--line);
    border-radius:999px; padding:19px 20px 19px 26px;
    box-shadow:0 2px 6px rgba(0,0,0,0.05), 0 12px 30px rgba(0,0,0,0.07);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field:focus-within { box-shadow:0 2px 8px rgba(0,0,0,0.06), 0 16px 36px rgba(0,0,0,0.10); }
  .field:focus-within { border-color:var(--accent); }
  .field input {
    flex:1; min-width:0; border:none; outline:none; background:transparent;
    color:var(--fg); font-size:18px; font-family:inherit;
  }
  .field input::placeholder { color:var(--muted); }
  .field .ficon {
    width:26px; height:26px; flex:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color:var(--accent);
  }
  .field .ficon svg { width:22px; height:22px; display:block; }
  .field .fdiv { width:1px; height:22px; background:var(--line); flex:none; }


  /* Shortcut row: bare circular icons on the page, no card shell.
     One plane only. The previous version sat a --field well with a --line
     border inside a --field card with a --line border, so the nesting had
     no contrast to justify it and read as clutter rather than hierarchy. */
  /* margin-top replaces what the "Quick access" heading used to carry: it had
     34 above and 16 below, and taking the heading out without putting anything
     back would have dropped the tiles straight onto the search pill. 22 is the
     old 50 minus the lift. */
  .shortcuts {
    width:100%; max-width:420px;
    display:grid; grid-template-columns:repeat(5,1fr);
    gap:10px 0;
    margin-top:18px; margin-bottom:4px;
  }
  .shortcuts.hidden { display:none; }
  .tile {
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:4px 0;
    text-decoration:none; color:var(--fg);
    /* A long press is ours now, so the system must not also offer to select
       the label or open its own link menu over the top of it. */
    -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
  }
  /* The add tile is deliberately not an icon: no border, no shadow, just a
     soft well with a plus in it, so it reads as an empty slot rather than as
     another site sitting among the real ones. */
  .tile.add .fav {
    background:rgba(128,128,128,0.13); border:none; box-shadow:none;
    color:var(--muted); font-size:24px; font-weight:400;
  }
  /* One frame for every tile: same size, same shape, always.
     That uniformity is the whole of what Samsung has. Their icons look
     consistent because each one is a real app icon already drawn as a rounded
     square - X is a black one, Facebook a blue one - so the row lines up by
     construction. Favicons do not: they arrive as circles, squares and
     silhouettes, and letting each keep its own outline is what made this row
     read as mixed.
     So the frame is imposed here instead, and the icon fills it. An icon that
     is already a full square (X, ChatGPT, Wikipedia) takes the frame over
     completely and reads as its own app icon. One that is a circle sits in the
     frame with its corners showing - the same way Google, Wikipedia and Amazon
     sit on a white tile on Samsung's own home.
     44px rather than 48: five across a 360dp phone leaves 64 to a cell, and
     the smaller mark is what stops two full rows reading as clutter. */
  .tile .fav {
    width:44px; height:44px; border-radius:12px;
    background:var(--field); border:1px solid var(--line);
    box-shadow:0 1px 2px rgba(0,0,0,0.05);
    display:flex; align-items:center; justify-content:center;
    font-size:17px; font-weight:600; color:var(--accent);
    overflow:hidden;
    transition:transform .12s ease;
  }
  /* Press shrinks the icon. The old :active painted a rounded-rect wash
     behind the tile, which without a shell to sit in reads as a stray box. */
  .tile:active .fav { transform:scale(0.92); }
  /* contain, not cover: cover fills by cropping, and the first thing it would
     crop off a non-square icon is exactly the protruding part that makes it
     recognisable - Reddit's ears. Nothing is cut. */
  .tile .fav img { width:100%; height:100%; object-fit:contain; display:block; }
  .tile span {
    font-size:11px; font-weight:500; color:var(--fg); max-width:100%;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  /* News feed */
  .feed { width:100%; max-width:600px; margin-top:12px; }
  .feed.hidden { display:none; }
  .feed-head, .qa-head {
    font-size:14px; font-weight:600; color:var(--muted);
    /* No side margin. The wrap already insets everything by 14px, so 4px
       here put the label 18px in while every card beside it sat at 14 - a
       3.6dp step that reads as a section that was not quite placed. */
    letter-spacing:-0.005em; margin:0 0 10px;
  }
  .qa-head { width:100%; max-width:420px; margin-top:22px; margin-bottom:16px; }
  .qa-head.hidden { display:none; }
  .feed-card {
    display:flex; flex-direction:column; align-items:stretch;
    background:var(--field); border:1px solid var(--line);
    border-radius:24px; overflow:hidden; margin-bottom:16px;
    text-decoration:none; color:var(--fg);
    box-shadow:0 1px 2px rgba(0,0,0,0.07), 0 4px 12px rgba(0,0,0,0.07);
  }
  .feed-card:active { background:rgba(128,128,128,0.10); }
  .feed-card .thumb {
    width:100%; height:180px; background:var(--line);
    background-size:cover; background-position:center;
  }
  .feed-card .body { padding:14px 16px 16px; min-width:0; }
  .feed-card .title {
    font-size:16px; font-weight:700; line-height:1.4; letter-spacing:-0.01em;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
    overflow:hidden;
    /* Clipping hides the overflow but the box still measures full width, so a
       long unbroken headline pushes the card out. Wrapping it removes the
       cause rather than hiding it. */
    overflow-wrap:anywhere;
  }
  .feed-card .src { font-size:11px; color:var(--muted); text-transform:capitalize; }
  .feed-card .cardfoot {
    display:flex; align-items:center; justify-content:space-between;
    margin-top:10px; gap:10px;
  }
  .feed-card .cardfoot .srcwrap {
    flex:1; min-width:0; display:flex; align-items:center; gap:7px;
  }
  .feed-card .cardfoot .src { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .feed-card .favicon {
    width:16px; height:16px; flex:none; border-radius:6px; display:block;
    object-fit:contain; background:rgba(128,128,128,0.08);
  }
  .feed-card .sharebtn {
    flex:none; width:34px; height:34px; margin:-6px -6px -6px 0;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%; color:var(--muted);
  }
  .feed-card .sharebtn:active { background:rgba(128,128,128,0.15); }
  .feed-card .sharebtn svg { width:17px; height:17px; display:block; }
  .feed-card.no-thumb .thumb { display:none; }
  /* Placeholder shown while an image loads or when it fails (offline): a clean
     branded tint with a subtle glyph, so cards never look broken or blank. */
  .feed-card .thumb.thumb-ph {
    background-color:var(--line);
    background-image:
      linear-gradient(135deg, rgba(43,108,240,0.10), rgba(43,108,240,0.02));
    display:flex; align-items:center; justify-content:center;
  }
  .feed-card .thumb.thumb-ph::after {
    content:"";
    width:34px; height:34px; opacity:0.28;
    background-color:var(--muted);
    -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'><path d='M216 40H40a16 16 0 00-16 16v144a16 16 0 0016 16h176a16 16 0 0016-16V56a16 16 0 00-16-16zm0 16v102l-30-30a16 16 0 00-22 0l-52 52-26-26a16 16 0 00-22 0l-2 2V56zM40 174l40-40 58 58H40zm176 26h-70l-28-28 44-44 54 54v18z'/><circle cx='84' cy='100' r='16'/></svg>") center/contain no-repeat;
    mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'><path d='M216 40H40a16 16 0 00-16 16v144a16 16 0 0016 16h176a16 16 0 0016-16V56a16 16 0 00-16-16zm0 16v102l-30-30a16 16 0 00-22 0l-52 52-26-26a16 16 0 00-22 0l-2 2V56zM40 174l40-40 58 58H40zm176 26h-70l-28-28 44-44 54 54v18z'/><circle cx='84' cy='100' r='16'/></svg>") center/contain no-repeat;
  }
  /* Gentle entrance for feed cards */
  @keyframes cardIn {
    from { opacity:0; transform:translateY(14px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .feed-card { animation:cardIn .45s cubic-bezier(.22,.61,.36,1) both; }
  /* Ripple on tappable surfaces */
  .tile .fav, .feed-card, .ficon { position:relative; overflow:hidden; }
  /* Follows the user's accent. It was pinned to one purple, so every other
     accent left taps flashing a colour from a theme nobody had chosen. */
  .ripple {
    position:absolute; border-radius:50%; transform:scale(0);
    background:var(--accent); opacity:0.26; pointer-events:none;
    animation:rippleOut .55s ease-out;
  }
  @keyframes rippleOut { to { transform:scale(2.4); opacity:0; } }
  /* Skeleton loading cards — mirror the real card shape, then shimmer */
  .skel-card {
    display:flex; flex-direction:column; align-items:stretch;
    background:var(--field); border:1px solid var(--line);
    border-radius:24px; overflow:hidden; margin-bottom:16px;
    box-shadow:0 1px 2px rgba(0,0,0,0.07), 0 4px 12px rgba(0,0,0,0.07);
  }
  .skel-thumb { width:100%; height:180px; }
  .skel-body { padding:14px 16px 16px; display:flex; flex-direction:column; gap:10px; }
  .skel-line { height:13px; border-radius:6px; }
  .skel-line.w80 { width:80%; }
  .skel-line.w60 { width:60%; }
  .skel-line.src { height:10px; width:34%; margin-top:6px; }
  .shimmer {
    background:linear-gradient(100deg,
      rgba(139,107,216,0.08) 30%,
      rgba(139,107,216,0.20) 50%,
      rgba(139,107,216,0.08) 70%);
    background-size:220% 100%;
    animation:shimmer 1.3s ease-in-out infinite;
  }
  @keyframes shimmer { from { background-position:180% 0; } to { background-position:-40% 0; } }
  .feed-fade-out { animation:feedFade .22s ease forwards; }
  @keyframes feedFade { to { opacity:0; transform:translateY(-6px); } }
  /* Night Owl private empty-state */
  .nightowl-empty { display:none; width:100%; max-width:520px; margin-top:46px;
    text-align:center; animation:cardIn .5s ease both; }
  .nightowl-empty.show { display:block; }
  .night-line { font-size:17px; font-weight:700; color:var(--fg); letter-spacing:-0.01em; }
  .night-sub { font-size:14px; color:var(--muted); margin-top:8px; line-height:1.5;
    font-style:italic; }
</style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="wordmark">Search</div>
    <label class="field" id="field">
      <input id="q" type="text" inputmode="search" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Search the web" />
      <span class="ficon" id="micBtn" role="button" aria-label="Voice search">
        <svg viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><rect x="88" y="24" width="80" height="128" rx="40"/><path d="M200 128a72 72 0 0 1-144 0M128 200v32"/></svg>
      </span>
      <span class="fdiv"></span>
      <span class="ficon" id="scanBtn" role="button" aria-label="Scan code">
        <svg viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><path d="M40 88V56a16 16 0 0 1 16-16h32M168 40h32a16 16 0 0 1 16 16v32M216 168v32a16 16 0 0 1-16 16h-32M88 216H56a16 16 0 0 1-16-16v-32M40 128h176"/></svg>
      </span>
    </label>
    <div class="shortcuts" id="tiles"></div>
    <div class="feed hidden" id="feed"></div>
    <div class="nightowl-empty" id="nightMsg">
      <div class="night-line">You're browsing in the dark.</div>
      <div class="night-sub">The owl sees everything, remembers nothing.</div>
    </div>
  </div>
<script>
  var showTiles = true;
  var nightOwl = false;
  try {
    if (window.SearchApp && window.SearchApp.getConfig) {
      var cfg = JSON.parse(window.SearchApp.getConfig());
      if (cfg.accent) document.documentElement.style.setProperty('--accent', cfg.accent);
      showTiles = (cfg.tiles !== false);
      nightOwl = (cfg.nightOwl === true);
    }
  } catch (e) {}
  // In Night Owl (private) mode, show a calm empty state instead of tiles/feed.
  if (nightOwl) {
    showTiles = false;
    var _t = document.getElementById('tiles'); if (_t) _t.style.display = 'none';
    var _q = document.getElementById('qaHead'); if (_q) _q.style.display = 'none';
    var _f = document.getElementById('feed'); if (_f) _f.style.display = 'none';
    var _n = document.getElementById('nightMsg'); if (_n) _n.classList.add('show');
  }

  // ---------- Search box: dumb button that opens the native search page ----------
  var input = document.getElementById('q');
  input.readOnly = true;  // no typing here; the native omnibox handles input
  function openNativeSearch() {
    if (window.SearchApp && window.SearchApp.focusSearch) window.SearchApp.focusSearch();
  }
  input.addEventListener('focus', function () { input.blur(); openNativeSearch(); });
  input.addEventListener('click', openNativeSearch);

  var micBtn = document.getElementById('micBtn');
  var scanBtn = document.getElementById('scanBtn');
  if (micBtn) micBtn.addEventListener('click', function(e){
    e.preventDefault(); e.stopPropagation();
    if (window.SearchApp && window.SearchApp.startVoice) window.SearchApp.startVoice();
  });
  if (scanBtn) scanBtn.addEventListener('click', function(e){
    e.preventDefault(); e.stopPropagation();
    if (window.SearchApp && window.SearchApp.startScan) window.SearchApp.startScan();
  });

  // ---------- Shortcut tiles ----------
  var host = document.getElementById('tiles');

  function labelFromDomain(d){
    var name = d.split('.')[0];
    return name.charAt(0).toUpperCase() + name.slice(1);
  }

  /**
   * canFetch says whether this tile is allowed to go and get an icon.
   *
   * Every tile used to fetch from Google's favicon service, falling back to
   * DuckDuckGo's - which meant opening a new tab announced the list of sites
   * in your history to two third parties, by name, every single time. A
   * browser with a privacy policy cannot be doing that quietly.
   *
   * The line is drawn at intent rather than at origin. A built-in shortcut is
   * a constant in the app, and one the user pinned through the plus is a
   * deliberate choice about their own home screen; neither says anything about
   * where they have been browsing. A site that is merely in history says
   * exactly that, so it never asks - it shows the icon captured when it was
   * visited, or its accent letter.
   */
  /**
   * scale trims or bleeds one icon inside the shared frame.
   *
   * The frame is uniform, but the art inside it is not: some favicons are
   * drawn to the edge of their square, some float small in the middle, and a
   * circle inscribed in a square can never reach the corners of one. Rather
   * than bend the frame per icon - which is what broke the row's consistency
   * last time - the icon is nudged to fit the frame it is given.
   * Above 1 it bleeds past the edges and clips; below 1 it sits in.
   */
  function buildTile(label, url, canFetch, scale){
    var a=document.createElement('a'); a.className='tile'; a.href='javascript:void(0)';

    // Long press removes. The flag is what stops the press that opened the
    // remove dialog ALSO counting as a tap and loading the site behind it.
    var held=false, timer=null;
    function cancelHold(){ if(timer){ clearTimeout(timer); timer=null; } }
    a.addEventListener('touchstart', function(){
      held=false;
      cancelHold();
      timer=setTimeout(function(){
        timer=null; held=true;
        try { if (navigator.vibrate) navigator.vibrate(12); } catch(e){}
        if(window.SearchApp&&window.SearchApp.removeShortcut){
          window.SearchApp.removeShortcut(label, url);
        }
      }, 500);
    }, {passive:true});
    a.addEventListener('touchend', cancelHold, {passive:true});
    a.addEventListener('touchmove', cancelHold, {passive:true});
    a.addEventListener('touchcancel', function(){ cancelHold(); held=false; }, {passive:true});

    a.onclick=function(){
      if (held) { held=false; return; }
      if(window.SearchApp&&window.SearchApp.open) window.SearchApp.open(url);
    };
    var fav=document.createElement('div'); fav.className='fav';
    fav.textContent=label.charAt(0).toUpperCase();
    var span=document.createElement('span'); span.textContent=label;
    a.appendChild(fav); a.appendChild(span); host.appendChild(a);
    var dom=url.replace(/^https?:\/\//,'').split('/')[0]
      .replace(/^www\./,'').replace(/^mobile\./,'').replace(/^m\./,'');

    var img=document.createElement('img');
    // The frame clips, so a scale above 1 fills the corners rather than
    // spilling onto the page.
    if (scale && scale !== 1) img.style.transform = 'scale(' + scale + ')';
    // Handlers before src: a cached icon can fire load before they attach,
    // which is why a tile sometimes kept its letter for no reason at all.
    img.onload=function(){
      fav.textContent='';
      fav.classList.add('has-icon');   // drops the card behind a real icon
      fav.appendChild(img);
    };

    // The captured icon wins whenever there is one: it came from the site
    // itself, it is already on the device, and it costs no request.
    var local='';
    try {
      if (window.SearchApp && window.SearchApp.getCachedFavicon) {
        local = window.SearchApp.getCachedFavicon(dom) || '';
      }
    } catch(e){}
    if (local) { img.src = local; return; }

    // Nothing captured yet. Only a tile the user chose on purpose may ask for
    // one - the built-ins, and anything they pinned themselves. A site that is
    // merely in history never does: fetching for those is what would announce
    // the browsing history to a third party, which is the whole reason the
    // capture-on-visit cache exists.
    if (!canFetch) return;

    var fellBack=false;
    img.onerror=function(){
      if(fellBack) return;
      fellBack=true;
      img.src='https://icons.duckduckgo.com/ip3/'+dom+'.ico';
    };
    img.src='https://www.google.com/s2/favicons?domain='+dom+'&sz=256';
  }

  /* The global top sites, in rank order (Similarweb, Aug 2026), minus two
     that do not belong in a browser's shortcut row: Bing, because a second
     search engine is redundant when the whole top bar is search, and
     WhatsApp, because web.whatsapp.com is the QR-pairing desktop client and
     is useless on a phone. Wikipedia is kept at the end on merit - it sits
     just outside the top ten and is worth more here than the sites that
     edged it out. */
  var DEFAULTS=[
    {label:'Google',    url:'https://www.google.com'},
    // Drawn hard to the edge of its square, so it read a size larger than
    // everything beside it.
    {label:'YouTube',   url:'https://m.youtube.com',    scale:0.82},
    // A circle inside a squircle leaves four white corners. 1.2 is the ratio
    // that pushes the blue past the frame's corner arc, so the clip takes a
    // sliver off the circle's edge and the white goes. The white f sits well
    // inside and is untouched.
    {label:'Facebook',  url:'https://m.facebook.com',   scale:1.2},
    {label:'Instagram', url:'https://www.instagram.com'},
    {label:'ChatGPT',   url:'https://chatgpt.com'},
    {label:'X',         url:'https://x.com'},
    {label:'Reddit',    url:'https://www.reddit.com'},
    {label:'Wikipedia', url:'https://m.wikipedia.org'}
  ];

  function renderTiles(){
    host.innerHTML='';
    // The heading follows the tiles: hidden together, or it labels nothing.
    var qaHead = document.getElementById('qaHead');
    if (!showTiles){
      host.classList.add('hidden');
      if (qaHead) qaHead.classList.add('hidden');
      return;
    }
    host.classList.remove('hidden');
    if (qaHead) qaHead.classList.remove('hidden');

    var recent=[];
    try {
      if (window.SearchApp && window.SearchApp.getRecentSites) {
        recent = JSON.parse(window.SearchApp.getRecentSites());
      }
    } catch(e){ recent=[]; }

    var custom=[], hidden=[];
    try {
      if (window.SearchApp && window.SearchApp.getShortcuts) {
        var sc = JSON.parse(window.SearchApp.getShortcuts()) || {};
        custom = sc.custom || [];
        hidden = sc.hidden || [];
      }
    } catch(e){ custom=[]; hidden=[]; }

    // Recent sites (newest first) push in from the left; defaults fill the rest.
    // Ten now rather than four - two full rows of five - with the built-ins
    // falling off the right as real history takes their places.
    // One comparison key for all three sources, so a site cannot appear twice
    // under two spellings and a removal actually catches it.
    function keyOf(u){
      return u.replace(/^https?:\/\//,'').split('/')[0]
              .replace(/^www\./,'').replace(/^mobile\./,'').replace(/^m\./,'')
              .toLowerCase();
    }

    var combined = [], seenKeys = [];
    function consider(t){
      var k = keyOf(t.url);
      if (!k) return;
      if (hidden.indexOf(k) >= 0) return;      // removed by the user
      if (seenKeys.indexOf(k) >= 0) return;    // already in from a better source
      seenKeys.push(k);
      combined.push(t);
    }

    // Order of authority: what the user put there, then where they have been,
    // then what shipped with the app.
    // canFetch, not builtIn: a shortcut the user pinned by hand is a
    // deliberate choice they made about their own home screen, so it may go
    // and get its icon like the built-ins do. Otherwise a site added through
    // the plus shows an accent letter until it happens to be visited, which
    // is not what adding a shortcut is supposed to feel like.
    custom.forEach(function(c){
      consider({label:c.label || labelFromDomain(keyOf(c.url)), url:c.url,
                canFetch:true});
    });
    recent.forEach(function(r){
      consider({label:labelFromDomain(r.domain), url:r.url, canFetch:false});
    });
    DEFAULTS.forEach(function(d){
      consider({label:d.label, url:d.url, canFetch:true, scale:d.scale});
    });

    // Eight sites and the plus: nine in a five-wide grid, which is a full row
    // and most of a second.
    combined.slice(0,8).forEach(function(t){
      buildTile(t.label, t.url, t.canFetch, t.scale);
    });
    buildAddTile();
  }

  /** The empty slot at the end. Opens the native add dialog. */
  function buildAddTile(){
    var a=document.createElement('a');
    a.className='tile add'; a.href='javascript:void(0)';
    a.setAttribute('aria-label','Add shortcut');
    a.onclick=function(){
      if(window.SearchApp&&window.SearchApp.addShortcut) window.SearchApp.addShortcut();
    };
    var fav=document.createElement('div'); fav.className='fav';
    fav.textContent='+';
    var span=document.createElement('span'); span.textContent='Add';
    a.appendChild(fav); a.appendChild(span); host.appendChild(a);
  }

  // Lets the app redraw the tiles after an add or a remove, with no reload.
  window.__renderTiles = renderTiles;

  renderTiles();
  // Re-render tiles when the page becomes visible again (instant, no manual reload).
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') renderTiles();
  });
  window.addEventListener('pageshow', renderTiles);
  window.addEventListener('focus', renderTiles);

  // ---------- News feed ----------
  var feedHost = document.getElementById('feed');
  var feedReqId = 0;
  var feedLoaded = false;
  function showSkeletons(){
    feedHost.innerHTML='';
    feedHost.classList.remove('hidden');
    var head=document.createElement('div'); head.className='feed-head';
    head.textContent='Top stories';
    feedHost.appendChild(head);
    for (var i=0;i<3;i++){
      var c=document.createElement('div'); c.className='skel-card';
      var t=document.createElement('div'); t.className='skel-thumb shimmer';
      var b=document.createElement('div'); b.className='skel-body';
      var l1=document.createElement('div'); l1.className='skel-line w80 shimmer';
      var l2=document.createElement('div'); l2.className='skel-line w60 shimmer';
      var l3=document.createElement('div'); l3.className='skel-line src shimmer';
      b.appendChild(l1); b.appendChild(l2); b.appendChild(l3);
      c.appendChild(t); c.appendChild(b);
      feedHost.appendChild(c);
    }
  }

  function renderFeed(items){
    feedHost.innerHTML='';
    if (!items || !items.length){ feedHost.classList.add('hidden'); return; }
    var head=document.createElement('div'); head.className='feed-head';
    head.textContent='Top stories';
    feedHost.appendChild(head);
    items.slice(0,12).forEach(function(it, idx){
      var a=document.createElement('a'); a.className='feed-card'; a.href='javascript:void(0)';
      a.style.animationDelay=(idx*55)+'ms';
      a.onclick=function(){ if(window.SearchApp&&window.SearchApp.open) window.SearchApp.open(it.link); };
      if (it.image){
        var t=document.createElement('div'); t.className='thumb';
        // Preload the image; only paint it once it actually loads. If it fails
        // (e.g. offline), the card keeps a clean branded placeholder instead of
        // a blank or broken box.
        (function(thumb, src){
          var probe = new Image();
          probe.onload = function(){
            thumb.style.backgroundImage = "url('" + src.replace(/'/g,"%27") + "')";
            thumb.classList.remove('thumb-ph');
          };
          probe.onerror = function(){ thumb.classList.add('thumb-ph'); };
          thumb.classList.add('thumb-ph'); // placeholder until/unless it loads
          probe.src = src;
        })(t, it.image);
        a.appendChild(t);
      } else {
        a.classList.add('no-thumb');
      }
      var b=document.createElement('div'); b.className='body';
      var ti=document.createElement('div'); ti.className='title'; ti.textContent=it.title;
      b.appendChild(ti);
      var foot=document.createElement('div'); foot.className='cardfoot';
      var srcWrap=document.createElement('div'); srcWrap.className='srcwrap';
      // Crisp source favicon (requested at 2x display size), from the article
      // domain. Fails silently: onerror removes it so nothing looks broken.
      try {
        var dom = new URL(it.link).hostname.replace(/^www\./,'');
        if (dom) {
          var fav=document.createElement('img'); fav.className='favicon';
          fav.width=16; fav.height=16; fav.loading='lazy'; fav.alt='';
          fav.src='https://www.google.com/s2/favicons?sz=64&domain='+encodeURIComponent(dom);
          fav.onerror=function(){ if(fav.parentNode) fav.parentNode.removeChild(fav); };
          srcWrap.appendChild(fav);
        }
      } catch(e){}
      var sc=document.createElement('div'); sc.className='src'; sc.textContent=it.source||''; srcWrap.appendChild(sc);
      foot.appendChild(srcWrap);
      var sh=document.createElement('div'); sh.className='sharebtn';
      sh.setAttribute('role','button'); sh.setAttribute('aria-label','Share');
      sh.innerHTML='<svg viewBox="0 0 256 256" fill="currentColor"><path d="M176,160a39.7,39.7,0,0,0-28.6,12.1L91.4,140.5a40.1,40.1,0,0,0,0-25L147.4,83.9a40,40,0,1,0-8-14L83.4,101.5a40,40,0,1,0,0,53l56,31.6a40,40,0,1,0,36.6-26.1Z"/></svg>';
      sh.onclick=function(ev){ ev.stopPropagation(); ev.preventDefault(); if(window.SearchApp&&window.SearchApp.shareUrl) window.SearchApp.shareUrl(it.link, it.title||''); };
      foot.appendChild(sh);
      b.appendChild(foot);
      a.appendChild(b);
      feedHost.appendChild(a);
    });
    feedHost.classList.remove('hidden');
  }

  window.__onFeed = function(reqId, items){
    if (reqId !== feedReqId) return;
    feedLoaded = true;
    renderFeed(items);
  };

  // Called by the app when connectivity is restored, to swap cached/offline
  // content for fresh stories. Forces a fetch even if a feed already loaded.
  window.__reloadFeedOnline = function(){
    if (nightOwl) return;
    feedLoaded = false;
    loadFeed();
  };
  function loadFeed(){
    if (!window.SearchApp || !window.SearchApp.getFeed) return;
    // Show skeletons only when the feed is empty (first load), so a
    // background refresh doesn't replace real cards with placeholders.
    if (!feedHost.querySelector('.feed-card')) showSkeletons();
    feedReqId++;
    try { window.SearchApp.getFeed(feedReqId); } catch(e){}
  }

  if (!nightOwl) loadFeed();
  document.addEventListener('visibilitychange', function(){
    if (!nightOwl && document.visibilityState === 'visible' && !feedLoaded) loadFeed();
  });
  // Ripple effect on tappable surfaces.
  function addRipple(e){
    var el = e.currentTarget;
    var rect = el.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height);
    var r = document.createElement('span');
    r.className = 'ripple';
    r.style.width = r.style.height = size + 'px';
    var x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left - size/2;
    var y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top - size/2;
    r.style.left = x + 'px';
    r.style.top = y + 'px';
    el.appendChild(r);
    setTimeout(function(){ r.remove(); }, 560);
  }
  function bindRipples(){
    document.querySelectorAll('.tile .fav, .feed-card, .ficon').forEach(function(el){
      if (el.__rippleBound) return;
      el.__rippleBound = true;
      el.addEventListener('pointerdown', addRipple);
    });
  }
  bindRipples();
  // Re-bind after tiles/feed re-render.
  var _origRenderFeed = renderFeed;
  renderFeed = function(items){ _origRenderFeed(items); bindRipples(); };
  var _origRenderTiles = renderTiles;
  renderTiles = function(){ _origRenderTiles(); bindRipples(); };

  // ---------- Collapsing header ----------
  // Report to native when the in-page search pill leaves / re-enters the
  // viewport. Native swaps its top bar between the icon row and a full-width
  // pill. This block only observes: no DOM, CSS or layout change is made here.
  (function(){
    var f = document.getElementById('field');
    if (!f || !window.SearchApp || !window.SearchApp.homeFieldVisible) return;
    var last = null;
    function push(v){
      if (v === last) return;
      last = v;
      try { window.SearchApp.homeFieldVisible(v); } catch(e){}
    }
    // Native calls this after a tab switch, when this page may already be
    // scrolled but no intersection change will fire on its own.
    window.__syncHomeBar = function(){
      last = null;
      push(f.getBoundingClientRect().bottom > 0);
    };
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function(entries){
        push(entries[0].isIntersecting);
      }, { threshold: 0 }).observe(f);
    } else {
      window.addEventListener('scroll', function(){
        push(f.getBoundingClientRect().bottom > 0);
      }, { passive: true });
    }
    push(true);
  })();

  // Native reserves the tail of the page for the feed ad and parks its own view
  // in the gap. Height arrives in CSS px, already including the inter-card gap.
  window.__setAdSlot = function(px){
    document.documentElement.style.setProperty(
      '--adslot', (px > 0 ? px : 0) + 'px');
  };

  // The accent is read once at load, so a change made in Settings has to be
  // pushed into the live page or the wordmark keeps the old colour until reload.
  window.__setAccent = function(hex, hueShift){
    if (hex) document.documentElement.style.setProperty('--accent', hex);
  };
</script>
</body>
</html>
