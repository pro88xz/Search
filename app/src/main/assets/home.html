<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>Search</title>
<style>
  /* ---------- Tokens ----------
     Neutrals live here. Everything that carries the user's accent is derived
     from it in applyAccent() below and written onto :root as --accent-*, so a
     colour picked in Settings reaches every tinted surface, not just the
     wordmark. Script-written values are scheme-independent on purpose: an
     inline style on :root beats the dark-mode block, so the light/dark choice
     between two derived values (--accent-l / --accent-d, --ink-l) is made
     here, in CSS, never by script.
     --bg stays exactly the colour the native bars were drawn against, so there
     is no seam where the page meets the top bar. */
  :root {
    --bg:#F5F5F5; --surface:#FFFFFF; --fg:#16151B; --fg-2:#45434F; --muted:#7A7884;
    --line:#E8E7ED; --hair:rgba(22,20,40,0.08);

    --accent:#8B6BD8; --accent-rgb:139,107,216; --accent-2:#BCA9EA; --accent-deep:#6C53A8;
    --accent-l:#8B6BD8; --accent-d:#8B6BD8; --on-accent:#FFFFFF;
    --ink-l:#1D192B; --hero-ink:#1D1828; --hero-ink-rgb:29,24,40;

    --accent-text:var(--accent-l); --heading:var(--ink-l);
    --skel:#ECEBF0; --sweep:rgba(255,255,255,0.75);
    --press:rgba(22,20,40,0.05);
    --shadow-card:0 0 0 1px rgba(22,20,40,0.06), 0 1px 3px rgba(22,20,40,0.05), 0 10px 26px -14px rgba(22,20,40,0.16);
    --card-r:24px;
    --shadow-tile:0 1px 2px rgba(22,20,40,0.05), 0 6px 14px -6px rgba(22,20,40,0.16);
    --shadow-hero:0 2px 4px rgba(22,20,40,0.06), 0 18px 36px -14px rgba(22,20,40,0.42);
    --ease-out:cubic-bezier(.2,.8,.2,1);
    --ease-spring:cubic-bezier(.34,1.5,.64,1);
    --gutter:16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0E0E10; --surface:#18181C; --fg:#F4F3F7; --fg-2:#C9C7D1; --muted:#8E8C98;
      --line:#27272C; --hair:rgba(255,255,255,0.07);
      --accent-text:var(--accent-d); --heading:var(--fg);
      --skel:#1D1D22; --sweep:rgba(255,255,255,0.05);
      --press:rgba(255,255,255,0.05);
      --shadow-card:0 0 0 1px rgba(255,255,255,0.07), 0 1px 2px rgba(0,0,0,0.5);
      --shadow-tile:0 1px 2px rgba(0,0,0,0.5);
      --shadow-hero:0 18px 36px -16px rgba(0,0,0,0.7);
    }
  }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; padding:0; min-height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,"Roboto","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  /* A headline or address with no space in it is wider than the phone, and one
     of those is enough to make the whole page slide sideways under the thumb.
     Nothing here is meant to scroll horizontally except the category chips,
     which scroll inside their own box, so the page itself may not. */
  html, body { max-width:100%; overflow-x:hidden; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; margin:0; cursor:pointer; }
  svg { display:block; }

  /* The bottom reserve is room for the native bar, which overlaps the bottom
     58px of this page (its corners, and the arc the "+" button sits in, rise
     over it): the last card must clear it, with air to spare. */
  .wrap { min-height:100%; display:flex; flex-direction:column; align-items:center;
    padding:12px var(--gutter) 108px; }

  /* ---------- Wordmark ----------
     It used to be a 66px billboard taking a fifth of the first screen. Now it
     is a signature: still the brand, in the accent, but the search field and
     the stories below it are what the page is for. */
  .wordmark {
    font-size:34px; line-height:1; font-weight:800; letter-spacing:-0.03em;
    margin:8px 0 18px; padding:0 0.04em 2px;
    color:var(--accent-text);
    background:linear-gradient(100deg, var(--accent-deep) 0%, var(--accent) 52%, var(--accent-2) 120%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  @media (prefers-color-scheme: dark) {
    .wordmark { background:linear-gradient(100deg, var(--accent-d) 0%, var(--accent-2) 100%);
      -webkit-background-clip:text; background-clip:text; }
  }

  /* ---------- Search field ----------
     Still a dumb button: the native omnibox does the typing. The motion is
     what makes it feel alive - it presses in under the thumb with an accent
     ring, and its hint quietly walks through what it can do, lighting the mic
     or the scanner when the hint is about them. */
  .field {
    position:relative; width:100%; max-width:640px; height:56px;
    display:flex; align-items:center;
    padding:0 6px 0 18px;
    background:var(--surface); border-radius:28px; cursor:text;
    box-shadow:0 2px 6px rgba(22,20,40,0.04),
               0 14px 30px -12px rgba(var(--accent-rgb),0.34);
    transition:transform .55s var(--ease-spring);
    -webkit-user-select:none; user-select:none;
  }
  @media (prefers-color-scheme: dark) {
    .field { box-shadow:0 14px 30px -14px rgba(var(--accent-rgb),0.45); }
  }
  /* The ring is its own layer so pressing animates opacity and scale only. */
  .field::before {
    content:""; position:absolute; left:-4px; top:-4px; right:-4px; bottom:-4px;
    border-radius:32px; border:2px solid rgba(var(--accent-rgb),0.55);
    opacity:0; transform:scale(0.97); pointer-events:none;
    transition:opacity .35s ease, transform .45s var(--ease-out);
  }
  .field.is-pressed { transform:scale(0.985); transition:transform .18s var(--ease-out) 30ms; }
  .field.is-pressed::before { opacity:1; transform:none; transition-duration:.18s; }
  .field .fglyph { flex:none; width:22px; height:22px; margin-right:12px; color:var(--accent-text);
    transition:transform .45s var(--ease-spring); }
  .field.is-pressed .fglyph { transform:scale(1.12) rotate(-8deg); }
  .field .fglyph svg { width:22px; height:22px; }
  .field .fin { position:relative; flex:1; min-width:0; height:100%; }
  .field input {
    position:absolute; left:0; top:0; width:100%; height:100%;
    border:none; outline:none; background:transparent; padding:0; margin:0;
    color:var(--fg); font-size:16.5px; font-family:inherit; cursor:text;
  }
  .field input::placeholder { color:transparent; }
  .field .fhint {
    position:absolute; left:0; right:0; top:50%; margin-top:-11px; height:22px; line-height:22px;
    font-size:16.5px; color:var(--muted); letter-spacing:-0.005em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none;
  }
  .field .ficon {
    position:relative; width:42px; height:42px; flex:none; border-radius:50%; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:var(--accent-text);
  }
  .field .ficon::before {
    content:""; position:absolute; left:0; top:0; right:0; bottom:0; border-radius:50%;
    background:rgba(var(--accent-rgb),0.14); opacity:0; transform:scale(0.6);
    transition:opacity .3s ease, transform .4s var(--ease-out);
  }
  .field .ficon.is-pressed::before, .field .ficon.is-hinted::before { opacity:1; transform:none; }
  .field .ficon.is-pressed svg { transform:scale(0.9); }
  .field .ficon svg { position:relative; width:21px; height:21px; transition:transform .3s var(--ease-spring); }
  .field .fdiv { width:1px; height:22px; background:var(--line); flex:none; margin:0 2px; }

  /* ---------- Shortcut tiles ----------
     One frame for every tile: same size, same shape, always. Favicons arrive
     as circles, squares and silhouettes, so the frame is imposed here and the
     icon fills it - one that is already a full square takes the frame over and
     reads as its own app icon, one that is a circle sits in it with its
     corners showing. 48px: five across a 360dp phone leaves 65 to a cell,
     which is room for the icon, its shadow and a 17px gutter. */
  .shortcuts {
    width:100%; max-width:400px;
    display:grid; grid-template-columns:repeat(5,1fr);
    row-gap:16px; margin-top:24px;
  }
  .shortcuts.hidden { display:none; }
  .tile {
    display:flex; flex-direction:column; align-items:center;
    padding:2px 0; min-width:0;
    text-decoration:none; color:var(--fg-2);
    /* A long press is ours, so the system must not also offer to select the
       label or open its own link menu over the top of it. */
    -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
  }
  .tile .fav {
    position:relative; width:48px; height:48px; border-radius:15px;
    background:var(--surface);
    box-shadow:0 0 0 1px var(--hair), var(--shadow-tile);
    display:flex; align-items:center; justify-content:center;
    font-size:18px; font-weight:700; color:var(--accent-text);
    overflow:hidden;
    transition:transform .5s var(--ease-spring);
  }
  /* No icon yet: an accent-tinted letter rather than a bare white square. */
  .tile .fav:not(.has-icon) { background:rgba(var(--accent-rgb),0.10); box-shadow:0 0 0 1px rgba(var(--accent-rgb),0.12); }
  /* contain, not cover: cover would crop off exactly the protruding part that
     makes a non-square icon recognisable - Reddit's ears. */
  .tile .fav img { width:100%; height:100%; object-fit:contain; display:block; }
  .tile .fav::after {
    content:""; position:absolute; left:0; top:0; right:0; bottom:0;
    background:#000; opacity:0; transition:opacity .25s ease; pointer-events:none;
  }
  .tile .lbl {
    margin-top:8px; font-size:11.5px; line-height:14px; font-weight:500; letter-spacing:0.005em;
    max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  /* Press dips the icon; holding keeps sinking it, so a long press visibly
     builds toward removing the shortcut; the release springs back. */
  .tile.is-pressed .fav { transform:scale(0.9); transition:transform .16s var(--ease-out) 30ms; }
  .tile.is-pressed .fav::after { opacity:0.06; }
  .tile.is-holding .fav { transform:scale(0.82); transition:transform .38s var(--ease-out); }
  .tile.is-holding .fav::after { opacity:0.1; }
  /* The add tile reads as an empty slot rather than as another site. */
  .tile.add .fav {
    background:rgba(var(--accent-rgb),0.06); box-shadow:none;
    border:1.5px dashed rgba(var(--accent-rgb),0.42); color:var(--accent-text);
  }
  .tile.add .fav svg { width:20px; height:20px; }
  .tile.add .lbl { color:var(--muted); }

  /* Entrance: the top of the page settles in once, on load. */
  @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
  @keyframes pop  { from { opacity:0; transform:translateY(8px) scale(0.86); } to { opacity:1; transform:none; } }
  .boot .wordmark { animation:rise .5s var(--ease-out) backwards; }
  .boot .field    { animation:rise .55s var(--ease-out) 60ms backwards; }
  .shortcuts.enter .tile { animation:pop .5s var(--ease-out) backwards; }

  /* ---------- Top Stories ---------- */
  .feed { width:100%; max-width:560px; margin-top:32px; }
  .feed.hidden { display:none; }
  .sec-head { display:flex; align-items:center; justify-content:space-between; min-height:36px; margin-bottom:12px; }
  .sec-title { display:flex; align-items:center; min-width:0; }
  .sec-title .flame { width:26px; height:26px; flex:none; margin:-2px 7px 0 -2px; }
  .sec-title h2 { margin:0; font-size:22px; line-height:1.1; font-weight:800; letter-spacing:-0.018em; color:var(--heading); }
  .see-all {
    display:flex; align-items:center; height:36px; padding:0 4px 0 12px; margin-right:-6px;
    border-radius:18px; font-size:14.5px; font-weight:600; color:var(--accent-text);
    position:relative; white-space:nowrap;
    transition:opacity .25s ease;
  }
  .see-all.off { opacity:0; pointer-events:none; }
  .see-all::before {
    content:""; position:absolute; left:0; top:0; right:0; bottom:0; border-radius:18px;
    background:rgba(var(--accent-rgb),0.12); opacity:0; transform:scale(0.8);
    transition:opacity .25s ease, transform .35s var(--ease-out);
  }
  .see-all.is-pressed::before { opacity:1; transform:none; }
  .see-all span, .see-all svg { position:relative; }
  .see-all svg { width:20px; height:20px; margin-left:1px; transition:transform .45s var(--ease-spring); }
  .feed.expanded .see-all svg { transform:rotate(-90deg); }

  /* Category filter chips: one scrolling row, bled to the screen edges so a
     chip slides out from under the bezel rather than vanishing at a margin. */
  .chips {
    display:flex; overflow-x:auto; overflow-y:hidden;
    margin:0 calc(-1 * var(--gutter)) 6px; padding:2px var(--gutter) 12px;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .chips::-webkit-scrollbar { display:none; }
  .chips.hidden { display:none; }
  .chip {
    position:relative; flex:none; height:34px; padding:0 15px; margin-right:8px; border-radius:17px;
    background:var(--surface); box-shadow:inset 0 0 0 1px var(--hair);
    font-size:13.5px; font-weight:600; color:var(--fg-2); letter-spacing:-0.005em;
    transition:transform .45s var(--ease-spring);
  }
  .chip:last-child { margin-right:0; }
  .chip::before {
    content:""; position:absolute; left:0; top:0; right:0; bottom:0; border-radius:17px;
    background:var(--accent); opacity:0; transform:scale(0.85);
    box-shadow:0 6px 14px -6px rgba(var(--accent-rgb),0.75);
    transition:opacity .25s ease, transform .4s var(--ease-spring);
  }
  .chip span { position:relative; }
  .chip[aria-pressed="true"] { color:var(--on-accent); }
  .chip[aria-pressed="true"]::before { opacity:1; transform:none; }
  .chip.is-pressed { transform:scale(0.94); transition-duration:.15s; }

  /* ---------- The story card ----------
     After Chrome's Discover: the whole feed is one white card on the
     page's grey, 24px corners and a hairline, and the stories run down it
     one after another - each with its picture the card's full width, the
     headline in a calm medium weight, and the publisher row under it (its
     round icon, its name, where and how long ago, then Share and a menu).
     The featured story leads the card with a taller picture, a "Top story"
     tag, a bigger headline and its summary. The feed's ad (native, laid
     over .adslot by the app) is drawn as one more story on the card, with
     its "Ad" label, as it must be. The class names (.list holding .row
     stories, .list-foot) are what expand, collapse and the filters address. */
  .sheet {
    position:relative; overflow:hidden;
    border-radius:var(--card-r); background:var(--surface);
    box-shadow:var(--shadow-card);
  }
  .hero, .row {
    position:relative; display:block; padding-bottom:12px;
    text-decoration:none; color:inherit;
    -webkit-touch-callout:default;
  }
  .hero::after, .row::after {
    content:""; position:absolute; left:0; top:0; right:0; bottom:0;
    background:var(--press); opacity:0; transition:opacity .3s ease; pointer-events:none;
  }
  .hero.is-pressed::after, .row.is-pressed::after { opacity:1; transition-duration:.12s; }

  /* Pictures sit in boxes whose size is fixed before they arrive, so
     nothing below ever moves when one lands. */
  .hero-media, .smedia { position:relative; display:block; overflow:hidden; background:var(--skel); }
  .hero-media { height:0; padding-top:62.5%; }
  .smedia { height:0; padding-top:56.25%; }
  .hero-media img, .smedia img {
    position:absolute; left:0; top:0; width:100%; height:100%; object-fit:cover; display:block;
    opacity:0; transition:opacity .45s ease;
  }
  .hero-media img.ok, .smedia img.ok { opacity:1; }
  .hero-media img.instant, .smedia img.instant { transition:none; }
  /* A hairline where a white picture would otherwise bleed into the card. */
  .hero-media::after, .smedia::after {
    content:""; position:absolute; left:0; top:0; right:0; bottom:0; pointer-events:none;
    box-shadow:inset 0 -1px 0 var(--hair);
  }

  .tag {
    position:absolute; left:14px; top:14px; z-index:2;
    display:flex; align-items:center; gap:6px;
    height:28px; padding:0 11px 0 9px; border-radius:14px;
    background:rgba(16,14,24,0.52); color:#fff;
    -webkit-backdrop-filter:blur(10px) saturate(1.4); backdrop-filter:blur(10px) saturate(1.4);
    font-size:12.5px; font-weight:650; letter-spacing:0.01em;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.14);
  }
  .tag i { width:7px; height:7px; border-radius:50%; background:var(--accent-2);
    box-shadow:0 0 0 3px rgba(var(--accent-rgb),0.35); }

  /* Video: a play button in the middle of the picture, as on YouTube's own cards. */
  .play {
    position:absolute; left:50%; top:50%; z-index:2; width:54px; height:54px; margin:-27px 0 0 -27px;
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:rgba(16,14,24,0.55); color:#fff;
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    box-shadow:0 6px 18px -6px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.12);
  }
  .play svg { width:22px; height:22px; margin-left:3px; }

  .hero-body { display:block; padding:16px 20px 0; }
  .hero-title {
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
    font-size:22px; line-height:1.28; font-weight:650; letter-spacing:-0.014em; color:var(--heading);
    overflow-wrap:anywhere; word-break:break-word; text-wrap:pretty;
  }
  .hero-sum {
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    margin-top:8px; font-size:14.5px; line-height:1.45; color:var(--fg-2);
    overflow-wrap:anywhere; word-break:break-word;
  }

  .sbody { display:block; padding:16px 20px 0; }
  .stitle {
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
    font-size:19px; line-height:1.32; font-weight:500; letter-spacing:-0.008em; color:var(--heading);
    overflow-wrap:anywhere; word-break:break-word; text-wrap:pretty;
  }

  /* The publisher row, the same on every card. */
  .meta { display:flex; align-items:center; min-height:56px; padding:4px 6px 6px 20px; min-width:0; }
  .meta .favwrap {
    flex:none; width:24px; height:24px; border-radius:50%; overflow:hidden; margin-right:10px;
    display:flex; align-items:center; justify-content:center;
    background:#fff; box-shadow:0 0 0 1px var(--hair);
  }
  .meta .favwrap img { width:18px; height:18px; display:block; border-radius:3px; }
  .meta .who { display:flex; align-items:center; min-width:0; flex:1; font-size:14px; line-height:1.2; }
  .meta .src { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-weight:550; color:var(--fg); }
  .meta .dot { flex:none; margin:0 5px; color:var(--muted); }
  .meta .site, .meta .time { flex:none; color:var(--muted); white-space:nowrap; }
  .ibtn {
    position:relative; flex:none; width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; color:var(--fg-2);
    transition:transform .45s var(--ease-spring), background-color .2s ease;
  }
  .ibtn svg { width:20px; height:20px; }
  .ibtn.more svg { width:22px; height:22px; }
  .ibtn.is-pressed { transform:scale(0.86); background:var(--press); transition-duration:.15s; }
  .mono {
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800; color:var(--accent-text); background:rgba(var(--accent-rgb),0.14);
  }

  .list { display:block; }
  /* The feed ad's place: the app's native card is laid over it, so it is an
     empty box exactly the card's size (SearchApp.adSlotAt / __setAdSlot). */
  .adslot { display:block; height:0; margin:0;
    transition:height .34s var(--ease-out), margin-bottom .34s var(--ease-out); }
  .list-foot {
    position:relative; display:flex; align-items:center; justify-content:center;
    width:100%; height:52px; margin-top:12px; border-radius:26px;
    background:var(--surface); box-shadow:var(--shadow-card);
    font-size:14.5px; font-weight:650; color:var(--accent-text);
    transition:transform .45s var(--ease-spring);
  }
  .list-foot.is-pressed { transform:scale(0.97); transition-duration:.15s; }

  /* While a picture loads its box shimmers. A picture that cannot load takes
     its story off the page: the rule is no story without its image. */
  .loading { background:var(--skel); }
  .loading::before {
    content:""; position:absolute; left:0; top:0; right:0; bottom:0; z-index:0;
    background:linear-gradient(90deg, rgba(255,255,255,0) 0%, var(--sweep) 50%, rgba(255,255,255,0) 100%);
    transform:translateX(-100%); animation:sweep 1.5s cubic-bezier(.4,0,.2,1) infinite;
  }

  /* Entrances for stories: staggered, transform and opacity only. */
  @keyframes storyIn { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  @keyframes heroIn  { from { opacity:0; transform:translateY(16px) scale(0.975); } to { opacity:1; transform:none; } }
  @keyframes softIn  { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  @keyframes unfold  { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:none; } }
  .enter.hero { animation:heroIn .6s var(--ease-out) backwards; }
  .enter      { animation:storyIn .5s var(--ease-out) backwards; }
  .soft       { animation:softIn .38s var(--ease-out) backwards; }
  .unfold     { animation:unfold .42s var(--ease-out) backwards; }

  /* ---------- Skeletons ----------
     Same shapes as the real thing. The shimmer is a gradient that slides
     across on transform, so it never repaints. */
  .sk { position:relative; overflow:hidden; background:var(--skel); }
  .sk::after {
    content:""; position:absolute; left:0; top:0; right:0; bottom:0;
    background:linear-gradient(90deg, rgba(255,255,255,0) 0%, var(--sweep) 50%, rgba(255,255,255,0) 100%);
    transform:translateX(-100%); animation:sweep 1.5s cubic-bezier(.4,0,.2,1) infinite;
  }
  @keyframes sweep { to { transform:translateX(100%); } }
  .sk-hero { overflow:hidden; background:var(--surface); }
  .sk-hero .sk-media { height:0; padding-top:62.5%;
    background-image:linear-gradient(135deg, rgba(var(--accent-rgb),0.10), rgba(var(--accent-rgb),0.02)); }

  .sk-meta { display:flex; align-items:center; gap:10px; margin-top:18px; }

  .sk-line { height:12px; border-radius:6px; }

  .sk-line.h { height:18px; }
  .w95 { width:95%; } .w80 { width:80%; } .w60 { width:60%; } .w45 { width:45%; } .w30 { width:30%; }
  .sk-card { border-radius:0; overflow:hidden; background:var(--surface); }
  .sk-sheet { border-radius:var(--card-r); overflow:hidden; background:var(--surface); box-shadow:var(--shadow-card); }
  .sk-card .sk-media { height:0; padding-top:56.25%; }
  .sk-card .sk-body { padding:16px 20px 18px; }

  /* ---------- Night Owl ---------- */
  .nightowl-empty { display:none; width:100%; max-width:520px; margin-top:56px; text-align:center;
    animation:rise .6s var(--ease-out) backwards; }
  .nightowl-empty.show { display:block; }
  .night-moon { width:52px; height:52px; margin:0 auto 18px; border-radius:50%;

  .night-line { font-size:18px; font-weight:700; color:var(--heading); letter-spacing:-0.015em; }
  .night-sub { font-size:14px; color:var(--muted); margin-top:8px; line-height:1.5; font-style:italic; }

     whatever was left half-done, as Chrome's home offers. */

  .resume-text { flex:1; min-width:0; display:flex; flex-direction:column; }
  .resume-label { font-size:12px; font-weight:700; color:var(--accent-text); letter-spacing:0.01em; }
  .resume-title {

  .resume-go { flex:none; width:22px; height:22px; color:var(--muted); }

     for you this week, counted on the phone (SearchApp.getPrivacyStats). */

    display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:13px; color:var(--muted);

  .shield b { color:var(--fg-2); font-weight:700; }

  /* ---------- Browsing modes ----------
     One page, composed three ways (html.mode-explore / -focus / -zen, from
     the app's config, changed live by __setMode). Explore is the page as
     it is. Focus keeps the search box, one row of shortcuts and Jump back
     in, and sits them a little above the middle of the screen so there is
     no hole where the stories were. Zen makes the search box the page:
     larger, centred, the wordmark above it, nothing else unless the user
     asked for a few shortcuts (html.zen-tiles). Nothing hidden here is
     fetched either: the script skips the feed, the stats and the ad's
     place outside Explore. */

  .mode-zen .resume { display:none !important; }
  .mode-focus .wrap, .mode-zen .wrap {
    min-height:100vh; justify-content:center; padding-top:24px; padding-bottom:22vh;
  }
  .mode-focus .shortcuts { margin-top:28px; }
  .mode-zen .wordmark { font-size:44px; margin-bottom:26px; }
  .mode-zen .field { height:64px; border-radius:32px; max-width:560px; padding-left:22px; }
  .mode-zen .field::before { border-radius:36px; }
  .mode-zen .field input, .mode-zen .field .fhint { font-size:18px; }
  .mode-zen .shortcuts { display:none; }
  .mode-zen.zen-tiles .shortcuts { display:grid; grid-template-columns:repeat(4,1fr); max-width:300px; margin-top:30px; }
  .mode-zen .tile .lbl { display:none; }

  }

<script>
(function(){
  'use strict';
  var root = document.documentElement;
  var reduceMotion = false;
  try {
    var rmq = window.matchMedia('(prefers-reduced-motion: reduce)');
    reduceMotion = rmq.matches;

  } catch (e) {}

  function bridge(){ return window.SearchApp || null; }

  // ---------- Accent ----------
  // One colour in, a family out. Every tinted surface on the page reads one of
  // these, so the chip, the arrow, the flame, the tiles' empty slot and the
  // shimmer all follow a change made in Settings without a reload.
  function parseHex(h){
    var m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(h || '').trim());
    if (!m) return null;
    var s = m[1];
    if (s.length === 3) s = s.charAt(0)+s.charAt(0)+s.charAt(1)+s.charAt(1)+s.charAt(2)+s.charAt(2);
    var n = parseInt(s, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function mix(a, b, t){ return [0,1,2].map(function(i){ return Math.round(a[i] + (b[i] - a[i]) * t); }); }
  function toHex(c){ return '#' + c.map(function(v){ return ('0' + v.toString(16)).slice(-2); }).join('').toUpperCase(); }
  function luminance(c){
    var f = c.map(function(v){ v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * f[0] + 0.7152 * f[1] + 0.0722 * f[2];

    // itself is honoured; the derived tints keep their defaults.

    st.setProperty('--accent-2', toHex(mix(c, WHITE, 0.4)));
    st.setProperty('--accent-deep', toHex(mix(c, BLACK, 0.22)));

    // is deepened on light, a dark one lifted on dark.

    st.setProperty('--accent-d', toHex(L < 0.18 ? mix(c, WHITE, 0.4) : c));

  var showTiles = true;
  var nightOwl = false;
  // The browsing mode: explore (everything), focus (no news), zen (search alone).
  var mode = 'explore';
  var zenTiles = false;
  try {
    var A = bridge();
    if (A && A.getConfig) {
      var cfg = JSON.parse(A.getConfig());
      if (cfg.accent) applyAccent(cfg.accent);
      showTiles = (cfg.tiles !== false);
      nightOwl = (cfg.nightOwl === true);
      if (cfg.mode === 'focus' || cfg.mode === 'zen') mode = cfg.mode;
      zenTiles = (cfg.zenTiles === true);
    }
  } catch (e) {}
  function modeClasses(){
    root.classList.remove('mode-explore', 'mode-focus', 'mode-zen');
    root.classList.add('mode-' + mode);
    root.classList.toggle('zen-tiles', zenTiles);
  }
  modeClasses();

  var tilesHost = document.getElementById('tiles');
  var feedHost = document.getElementById('feed');
  // In Night Owl (private) mode, a calm empty state instead of tiles and feed.
  if (nightOwl) {
    showTiles = false;
    tilesHost.style.display = 'none';
    feedHost.style.display = 'none';
    document.getElementById('nightMsg').classList.add('show');
  }
  setTimeout(function(){ document.getElementById('wrap').classList.remove('boot'); }, 900);

  // ---------- Press feedback ----------
  // One delegated listener: whatever carries data-press gets is-pressed for
  // as long as the finger is down. A press that turns into a scroll is
  // cancelled by the browser (pointercancel), and the CSS waits 30ms before
  // dipping, so flicking the page never makes cards flinch.
  var pressedEl = null;
  function clearPress(){
    if (pressedEl) { pressedEl.classList.remove('is-pressed'); pressedEl = null; }
  }
  document.addEventListener('pointerdown', function(e){
    var t = e.target;
    var el = t && t.closest ? t.closest('[data-press]') : null;
    clearPress();
    if (!el) return;
    pressedEl = el;
    el.classList.add('is-pressed');
  }, { passive:true });
  ['pointerup', 'pointercancel', 'dragstart'].forEach(function(n){
    document.addEventListener(n, function(){
      // A tap is so short the dip would never show; holding it for one more
      // frame lets the press read before it springs back.
      var el = pressedEl; pressedEl = null;
      if (el) setTimeout(function(){ el.classList.remove('is-pressed'); }, 70);
    }, { passive:true });
  });
  window.addEventListener('scroll', clearPress, { passive:true });
  window.addEventListener('blur', clearPress);

  // ---------- Search box: dumb button that opens the native search page ----------
  var field = document.getElementById('field');
  var input = document.getElementById('q');
  input.readOnly = true;  // no typing here; the native omnibox handles input
  function openNativeSearch() {
    var A = bridge();
    if (A && A.focusSearch) A.focusSearch();
  }
  input.addEventListener('focus', function () { input.blur(); openNativeSearch(); });
  input.addEventListener('click', openNativeSearch);

  var micBtn = document.getElementById('micBtn');
  var scanBtn = document.getElementById('scanBtn');
  micBtn.addEventListener('click', function(e){
    e.preventDefault(); e.stopPropagation();
    var A = bridge();
    if (A && A.startVoice) A.startVoice();
  });
  scanBtn.addEventListener('click', function(e){
    e.preventDefault(); e.stopPropagation();
    var A = bridge();
    if (A && A.startScan) A.startScan();
  });

  // The hint walks through what the field can do - twice, then rests on the
  // plain one. When it is about the mic or the scanner, that button lights
  // up with it. Paused while the page is hidden or the field is off screen.
  var hintEl = document.getElementById('hint');
  var HINTS = [
    { text:'Search the web' },
    { text:'Enter a web address' },
    { text:'Search with your voice', el:micBtn },
    { text:'Scan a QR code', el:scanBtn }
  ];
  var hintIdx = 0, hintSteps = 0, hintTimer = null, fieldOnScreen = true;
  function hintTick(){
    hintTimer = null;
    if (reduceMotion) return;
    if (document.hidden || !fieldOnScreen) { hintTimer = setTimeout(hintTick, 1500); return; }
    hintIdx = (hintIdx + 1) % HINTS.length;
    hintSteps++;
    showHint(HINTS[hintIdx]);
    if (hintSteps < HINTS.length * 2) hintTimer = setTimeout(hintTick, hintIdx === 0 ? 4200 : 3000);
  }
  function showHint(h){
    var swap = function(){
      hintEl.textContent = h.text;
      micBtn.classList.toggle('is-hinted', h.el === micBtn);
      scanBtn.classList.toggle('is-hinted', h.el === scanBtn);

        [{ opacity:0, transform:'translateY(9px)' }, { opacity:1, transform:'none' }],
        { duration:320, easing:'cubic-bezier(.2,.8,.2,1)' });

      [{ opacity:1, transform:'none' }, { opacity:0, transform:'translateY(-9px)' }],
      { duration:190, easing:'cubic-bezier(.4,0,1,1)', fill:'forwards' });

  }
  if (!reduceMotion) hintTimer = setTimeout(hintTick, 3200);

  // ---------- Shortcut tiles ----------
  function labelFromDomain(d){
    var name = d.split('.')[0];
    return name.charAt(0).toUpperCase() + name.slice(1);
  }
  function domainOf(url){
    return String(url).replace(/^https?:\/\//,'').split('/')[0]
      .replace(/^www\./,'').replace(/^mobile\./,'').replace(/^m\./,'');
  }

  /**
   * canFetch says whether this tile is allowed to go and get an icon.
   *
   * Every tile used to fetch from Google's favicon service, falling back to
   * DuckDuckGo's - which meant opening a new tab announced the list of sites
   * in your history to two third parties, by name, every single time. A
   * browser with a privacy policy cannot be doing that quietly.
   *
   * The line is drawn at intent rather than at origin. A built-in shortcut is
   * a constant in the app, and one the user pinned through the plus is a
   * deliberate choice about their own home screen; neither says anything about
   * where they have been browsing. A site that is merely in history says
   * exactly that, so it never asks - it shows the icon captured when it was
   * visited, or its accent letter.
   *
   * scale trims or bleeds one icon inside the shared frame. Some favicons are
   * drawn to the edge of their square, some float small in the middle, and a
   * circle inscribed in a square can never reach the corners of one. Rather
   * than bend the frame per icon, the icon is nudged to fit the frame it is
   * given. Above 1 it bleeds past the edges and clips; below 1 it sits in.

    // remove dialog ALSO counting as a tap and loading the site behind it.

      cancelHold();

      // building toward something before the dialog appears.

        timer = null; held = true;
        a.classList.remove('is-holding');
        try { if (navigator.vibrate) navigator.vibrate(12); } catch(e){}
        var A = bridge();
        if (A && A.removeShortcut) A.removeShortcut(label, url);

    a.addEventListener('touchend', cancelHold, { passive:true });
    a.addEventListener('touchmove', cancelHold, { passive:true });
    a.addEventListener('touchcancel', function(){ cancelHold(); held = false; }, { passive:true });

    // to the WebView's link menu for a javascript: address.
    a.addEventListener('contextmenu', function(e){ e.preventDefault(); });

    a.onclick = function(){
      if (held) { held = false; return; }
      var A = bridge();
      if (A && A.open) A.open(url);

    fav.textContent = label.charAt(0).toUpperCase();
    var span = document.createElement('span'); span.className = 'lbl'; span.textContent = label;

    var dom = domainOf(url);

    var img = document.createElement('img');
    img.alt = '';
    // The frame clips, so a scale above 1 fills the corners rather than
    // spilling onto the page.
    if (t.scale && t.scale !== 1) img.style.transform = 'scale(' + t.scale + ')';
    // Handlers before src: a cached icon can fire load before they attach,
    // which is why a tile sometimes kept its letter for no reason at all.
    img.onload = function(){
      fav.textContent = '';
      fav.classList.add('has-icon');
      fav.appendChild(img);
    };

    // The captured icon wins whenever there is one: it came from the site
    // itself, it is already on the device, and it costs no request.
    if (t.local) { img.src = t.local; return; }
    // An app's icon comes from the app (getAppIcon), which redraws the row
    // once it has it; until then, the letter.
    if (t.app) return;

    // Nothing captured yet. Only a tile the user chose on purpose may ask for
    // one - the built-ins, and anything they pinned themselves. A site that is
    // merely in history never does: fetching for those is what would announce
    // the browsing history to a third party, which is the whole reason the
    // capture-on-visit cache exists.
    if (!t.canFetch) return;

    var fellBack = false;
    img.onerror = function(){
      if (fellBack) return;
      fellBack = true;
      img.src = 'https://icons.duckduckgo.com/ip3/' + dom + '.ico';
    };
    img.src = 'https://www.google.com/s2/favicons?domain=' + dom + '&sz=256';
  }

  /* The global top sites, in rank order (Similarweb, Aug 2026), minus two
     that do not belong in a browser's shortcut row: Bing, because a second
     search engine is redundant when the whole top bar is search, and
     WhatsApp, because web.whatsapp.com is the QR-pairing desktop client and
     is useless on a phone. Amazon, the biggest marketplace, sits high; Reddit
     made way for it. Wikipedia is kept at the end on merit.

     pinned: always in the row, in the last place before the plus, however
     much history pushes the others off - Via, the music player, whose tile
     opens its Play Store listing (in the Play Store app; MainActivity) and
     wears the app's own icon, fetched from that listing once and kept
     (app, getAppIcon). */
  var DEFAULTS = [
    {label:'Google',    url:'https://www.google.com'},
    // Drawn hard to the edge of its square, so it read a size larger than
    // everything beside it.
    {label:'YouTube',   url:'https://m.youtube.com',    scale:0.82},
    {label:'Amazon',    url:'https://www.amazon.com'},
    // A circle inside a squircle leaves four white corners. 1.2 pushes the
    // blue past the frame's corner arc, so the clip takes a sliver off the
    // circle's edge and the white goes. The white f is untouched.
    {label:'Facebook',  url:'https://m.facebook.com',   scale:1.2},
    {label:'Instagram', url:'https://www.instagram.com'},
    {label:'ChatGPT',   url:'https://chatgpt.com'},
    {label:'X',         url:'https://x.com'},
    {label:'Wikipedia', url:'https://m.wikipedia.org'},
    {label:'Via',       url:'https://play.google.com/store/apps/details?id=app.devbangs.media',
     app:'app.devbangs.media', pinned:true}
  ];

  var tilesSig = null, tilesAnimated = false;
  function renderTiles(){
    // Zen draws (and fetches icons for) no shortcuts unless asked for some.
    if (!showTiles || (mode === 'zen' && !zenTiles)){
      tilesHost.innerHTML = '';
      tilesHost.classList.add('hidden');
      tilesSig = null;
      return;
    }
    tilesHost.classList.remove('hidden');
    var A = bridge();

    var recent = [];
    try {
      if (A && A.getRecentSites) recent = JSON.parse(A.getRecentSites());
    } catch(e){ recent = []; }

    var custom = [], hidden = [];

  }
  window.__setAdSlot = function(px){
    var h = px > 0 ? Math.round(px) : 0;
    if (h === adSlotH) { reportAdSlotSoon(); return; }
    adSlotH = h;
    if (!adSlotEl || !adSlotEl.parentNode) seatAdSlot();
    else sizeAdSlot(true);
  };
  // Asked again by the app whenever it needs the place (a new card, a tab
  // switch back to home), even if nothing moved.
  window.__adSlotWhere = function(){ adRep = ''; reportAdSlot(); };
  // Anything that moves the box - pictures and tiles arriving above it, a
  // text size change, a rotation - changes the page's size, which is when
  // its place is sent again.
  if (window.ResizeObserver) { try { new ResizeObserver(reportAdSlotSoon).observe(wrapEl); } catch (e) {} }
  window.addEventListener('resize', reportAdSlotSoon);
  window.addEventListener('load', reportAdSlotSoon);

  // A story or a publisher the reader hid from the card menu: off the page
  // now, and kept off (the app remembers it for the next loads).
  window.__hideStories = function(kind, value){
    if (!value) return;
    var keep = feed.items.filter(function(it){
      return kind === 'source' ? it.domain !== value : it.link !== value;
    });
    if (keep.length === feed.items.length) return;
    feed.items = keep;
    if (!keep.length) { renderFeed([]); return; }
    feed.cats = categoriesOf(keep);
    if (feed.cat !== 'All' && feed.cats.indexOf(feed.cat) < 0) feed.cat = 'All';
    feed.canExpand = keep.length > COLLAPSED_ROWS + 1 || feed.cats.length > 1;
    if (!feed.canExpand) feed.expanded = false;
    renderChips();
    chipsEl.classList.toggle('hidden', !chipsVisible());
    renderStories('soft');
    syncLabels();
  };

  function buildFoot(){
    var b = el('button', 'list-foot');
    b.type = 'button';
    b.setAttribute('data-press', '');
    b.appendChild(el('span', 'lbl', ''));
    b.addEventListener('click', function(){ setExpanded(!feed.expanded); });
    return b;
  }
  function syncLabels(){
    feedHost.classList.toggle('expanded', feed.expanded);
    seeAllEl.classList.toggle('off', !feed.canExpand);
    seeAllEl.firstChild.textContent = feed.expanded ? 'Show less' : 'See all';
    seeAllEl.setAttribute('aria-expanded', feed.expanded ? 'true' : 'false');
    var foot = storiesEl.querySelector('.list-foot');
    if (foot) foot.firstChild.textContent = feed.expanded
      ? 'Show less' : 'See all ' + feed.items.length + ' stories';
  }

  function visibleItems(){
    if (feed.cat === 'All') return feed.items;
    return feed.items.filter(function(it){ return it.category === feed.cat; });
  }

  function renderChips(){
    chipsEl.innerHTML = '';
    if (feed.cats.length < 2) return;
    ['All'].concat(feed.cats).forEach(function(c){
      var b = el('button', 'chip');
      b.type = 'button';
      b.setAttribute('data-press', '');
      b.setAttribute('data-cat', c);
      b.setAttribute('aria-pressed', c === feed.cat ? 'true' : 'false');
      b.appendChild(el('span', null, c));
      b.addEventListener('click', function(){ selectCat(c, b); });
      chipsEl.appendChild(b);
    });
  }
  function chipsVisible(){ return feed.expanded && feed.cats.length > 1; }

  // mode: 'enter' (first arrival, staggered), 'soft' (filter change), or
  // nothing (a background refresh, which should not perform at the reader).
  function renderStories(mode){
    renderStoriesOnly(mode);
    seatAdSlot();
  }
  function renderStoriesOnly(mode){
    var list = visibleItems();
    storiesEl.innerHTML = '';
    if (!list.length) return;
    var sheet = el('div', 'sheet');
    var hero = buildHero(list[0]);
    sheet.appendChild(hero);
    storiesEl.appendChild(sheet);
    var rest = list.slice(1);
    var rows = feed.expanded ? rest : rest.slice(0, COLLAPSED_ROWS);
    var needFoot = feed.canExpand;
    var anim = reduceMotion ? null : mode;
    if (anim) { sheet.classList.add(anim); }
    var card = el('div', 'list');
    sheet.appendChild(card);
    rows.forEach(function(it, i){
      var r = buildRow(it);
      if (anim) {
        r.classList.add(anim);
        var step = anim === 'enter' ? 55 : 30;
        r.style.animationDelay = (anim === 'enter' ? 140 : 40) + Math.min(i, 8) * step + 'ms';
      }
      card.appendChild(r);
    });
    if (needFoot) {
      var f = buildFoot();
      if (anim) { f.classList.add('soft'); f.style.animationDelay = (anim === 'enter' ? 420 : 120) + 'ms'; }
      storiesEl.appendChild(f);
    }
  }

  function showSkeletons(){
    ensureFrame();
    feedHost.classList.remove('hidden');
    chipsEl.classList.add('hidden');
    seeAllEl.classList.add('off');
    var html =
      '<div class="sk-sheet"><div class="sk-hero"><div class="sk sk-media"></div><div class="sk-body">' +
      '<div class="sk sk-line h w95"></div><div class="sk sk-line h w60"></div>' +
      '<div class="sk-meta"><div class="sk sk-dot"></div><div class="sk sk-line w30"></div></div></div></div>' +
      '';
    for (var i = 0; i < 2; i++) {
      html += '<div class="sk-card"><div class="sk sk-media"></div><div class="sk-body">' +
        '<div class="sk sk-line h ' + (i % 2 ? 'w80' : 'w95') + '"></div>' +
        '<div class="sk sk-line h ' + (i % 2 ? 'w45' : 'w60') + '"></div>' +
        '<div class="sk-meta"><div class="sk sk-dot"></div><div class="sk sk-line w30"></div></div></div></div>';
    }
    storiesEl.innerHTML = html + '</div>';
    seatAdSlot();
  }

  function renderFeed(raw, mode){
    var items = normalize(raw);
    if (!items.length) {
      feedHost.classList.add('hidden');
      if (storiesEl) storiesEl.innerHTML = '';
      feed.items = []; feed.shown = false;
      seatAdSlot();
      return;
    }
    ensureFrame();
    var first = !feed.shown;
    feed.items = items;
    feed.cats = categoriesOf(items);
    if (feed.cat !== 'All' && feed.cats.indexOf(feed.cat) < 0) feed.cat = 'All';
    feed.canExpand = items.length > COLLAPSED_ROWS + 1 || feed.cats.length > 1;
    if (!feed.canExpand) feed.expanded = false;
    renderChips();
    chipsEl.classList.toggle('hidden', !chipsVisible());
    renderStories(first ? 'enter' : (mode || null));
    syncLabels();
    feedHost.classList.remove('hidden');
    feed.shown = true;
    // Only now is the list the feed's own, so only now can the ad's place
    // be found in it (renderStories ran while feed.shown was still false).
    seatAdSlot();
  }

  // ----- Expand, collapse, filter -----
  function topOf(e){ return e.getBoundingClientRect().top; }
  // FLIP: measure, change the layout, then play each moved block back from
  // where it was. The layout jumps once, invisibly; what the eye sees is a
  // transform, which the compositor runs without touching layout or paint.
  function glide(e, dy, ms){
    if (!e || reduceMotion || !e.animate || Math.abs(dy) < 0.5) return;
    e.animate([{ transform:'translateY(' + dy + 'px)' }, { transform:'translateY(0)' }],
      { duration: ms || 460, easing:'cubic-bezier(.2,.8,.2,1)' });
  }
  // Fades nodes out, applies the change, then drops the fades: whatever
  // survives the change (the chip bar, once hidden) gets its opacity back
  // instead of staying invisible the next time it is shown.
  function fadeOut(nodes, ms, done){
    var live = nodes.filter(function(n){ return n && n.animate; });
    if (reduceMotion || !live.length) { done(); return; }
    var anims = [], called = false, left = live.length;
    var finish = function(){
      if (called) return;
      called = true;
      done();
      anims.forEach(function(a){ try { a.cancel(); } catch (e) {} });
    };
    live.forEach(function(n){
      var a = n.animate([{ opacity:1 }, { opacity:0 }], { duration:ms, easing:'ease-in', fill:'forwards' });
      anims.push(a);
      a.onfinish = function(){ if (--left <= 0) finish(); };
    });
    setTimeout(finish, ms + 120);
  }
  function smoothScrollTo(y, done){
    y = Math.max(0, y);
    if (reduceMotion || Math.abs(window.pageYOffset - y) < 2) { window.scrollTo(0, y); done(); return; }
    try { window.scrollTo({ top:y, behavior:'smooth' }); } catch (e) { window.scrollTo(0, y); }
    var start = Date.now();
    (function wait(){
      if (Math.abs(window.pageYOffset - y) < 2 || Date.now() - start > 900) { done(); return; }
      requestAnimationFrame(wait);
    })();
  }

  function setExpanded(on){
    if (!feed.canExpand || on === feed.expanded) return;
    var token = ++feed.token;
    if (on) expand(); else collapse(token);
  }

  function expand(){
    var hero = storiesEl.querySelector('.sheet');
    var card = storiesEl.querySelector('.list');
    var foot = storiesEl.querySelector('.list-foot');
    if (!card || !foot) { feed.expanded = true; renderChips(); chipsEl.classList.toggle('hidden', !chipsVisible()); renderStories(null); syncLabels(); return; }
    var heroTop = hero ? topOf(hero) : 0, cardTop = card ? topOf(card) : 0;
    var footOff = foot ? foot.offsetTop : 0;

    feed.expanded = true;
    renderChips();
    var showChips = chipsVisible();
    chipsEl.classList.toggle('hidden', !showChips);
    var rest = visibleItems().slice(1 + COLLAPSED_ROWS);
    rest.forEach(function(it, i){
      var r = buildRow(it);
      if (!reduceMotion) { r.classList.add('unfold'); r.style.animationDelay = (60 + Math.min(i, 10) * 32) + 'ms'; }
      card.appendChild(r);
    });
    seatAdSlot();
    syncLabels();

    if (showChips && !reduceMotion) {
      Array.prototype.forEach.call(chipsEl.children, function(c, i){
        c.classList.add('soft'); c.style.animationDelay = (i * 24) + 'ms';
      });
    }
    if (hero) glide(hero, heroTop - topOf(hero));
    // The foot rides down over the rows it uncovers, like a drawer opening.
    if (foot) glide(foot, footOff - foot.offsetTop, 520);
  }

  function collapse(token){
    var go = function(){
      if (token !== feed.token) return;
      var card = storiesEl.querySelector('.list');
      var rows = card ? Array.prototype.slice.call(card.querySelectorAll('.row')) : [];
      var extra = feed.cat === 'All' ? rows.slice(COLLAPSED_ROWS) : rows;
      var leaving = extra.slice(0, 12);
      if (!chipsEl.classList.contains('hidden')) leaving.push(chipsEl);
      if (feed.cat !== 'All') leaving.push(storiesEl.querySelector('.hero'));
      fadeOut(leaving, 150, function(){
        if (token !== feed.token) return;
        var hero = storiesEl.querySelector('.sheet');
        var heroTop = hero ? topOf(hero) : 0;
        var refilter = feed.cat !== 'All';
        feed.expanded = false;
        feed.cat = 'All';
        chipsEl.classList.add('hidden');
        if (refilter) {
          renderChips();
          renderStories('soft');
        } else {
          extra.forEach(function(r){ if (r.parentNode) r.parentNode.removeChild(r); });
          seatAdSlot();
          if (hero) glide(hero, heroTop - topOf(hero), 420);
        }
        syncLabels();
      });
    };
    // Bring the section's head back first, then fold: folding first would
    // pull the page out from under the reader and let the browser clamp the
    // scroll in one jump.
    var headTop = topOf(headEl);
    if (headTop < 0) smoothScrollTo(window.pageYOffset + headTop - 8, go);
    else go();
  }

  function selectCat(cat, chip){
    if (cat === feed.cat) return;
    var token = ++feed.token;
    feed.cat = cat;
    Array.prototype.forEach.call(chipsEl.children, function(c){
      c.setAttribute('aria-pressed', c.getAttribute('data-cat') === cat ? 'true' : 'false');
    });
    // Keep the chosen chip in the middle of its row.
    try {
      var left = chip.offsetLeft - (chipsEl.clientWidth - chip.offsetWidth) / 2;
      if (chipsEl.scrollTo) chipsEl.scrollTo({ left:Math.max(0, left), behavior: reduceMotion ? 'auto' : 'smooth' });
      else chipsEl.scrollLeft = Math.max(0, left);
    } catch (e) {}
    fadeOut(Array.prototype.slice.call(storiesEl.children), 120, function(){
      if (token !== feed.token) return;
      renderStories('soft');
      syncLabels();
    });
  }

  function refreshTimes(){
    Array.prototype.forEach.call(feedHost.querySelectorAll('.time[data-ts]'), function(t){
      var s = ago(Number(t.getAttribute('data-ts')));
      if (s && t.textContent !== s) t.textContent = s;
    });
  }

  window.__onFeed = function(reqId, items){
    if (reqId !== feedReqId || mode !== 'explore') return;
    feedLoaded = true;
    renderFeed(items);
  };

  // Newer stories than the ones on screen. The app answers with the saved
  // stories at once and refreshes behind them, and these are what that
  // refresh found. Taken in straight away unless the reader is among the
  // stories - swapping them then would move the page under their finger - in
  // which case they wait until the reader is back at the top, or home is next
  // brought back into view.
  var pendingFeed = null;
  function readingFeed(){
    return feed.shown && (feed.expanded || feed.cat !== 'All' || window.pageYOffset > 48);
  }
  function takePendingFeed(){
    if (!pendingFeed || readingFeed()) return;
    var items = pendingFeed;
    pendingFeed = null;
    var nodes = storiesEl ? Array.prototype.slice.call(storiesEl.children) : [];
    if (!feed.shown || !nodes.length) { renderFeed(items); return; }
    var token = ++feed.token;
    fadeOut(nodes, 160, function(){
      if (token !== feed.token) { if (!pendingFeed) pendingFeed = items; return; }
      renderFeed(items, 'soft');
    });
  }
  window.__onFeedUpdate = function(items){
    if (nightOwl || mode !== 'explore' || !items || !items.length) return;
    feedLoaded = true;
    pendingFeed = items;
    takePendingFeed();
  };
  window.addEventListener('scroll', function(){
    if (pendingFeed && window.pageYOffset <= 48) takePendingFeed();
  }, { passive: true });

  // Called by the app when connectivity is restored, to swap cached/offline
  // content for fresh stories. Forces a fetch even if a feed already loaded.
  window.__reloadFeedOnline = function(){
    if (nightOwl || mode !== 'explore') return;
    badImages = {};
    feedLoaded = false;
    loadFeed();
  };
  function loadFeed(){
    var A = bridge();
    if (!A || !A.getFeed) return;
    // Skeletons only when there is nothing real on screen (first load), so a
    // background refresh never swaps stories for placeholders.
    if (!feed.shown) showSkeletons();
    feedReqId++;
    try { A.getFeed(feedReqId); } catch(e){}
  }

  if (!nightOwl && mode === 'explore') loadFeed();
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState !== 'visible' || nightOwl || mode !== 'explore') return;
    if (!feedLoaded) loadFeed();
    else { refreshTimes(); takePendingFeed(); }
  });

  // ---------- Collapsing header ----------
  // Report to native when the in-page search pill leaves / re-enters the
  // viewport. Native swaps its top bar between the icon row and a full-width
  // pill. This block only observes.
  (function(){
    var f = field;
    var A = bridge();
    var last = null;
    function push(v){
      fieldOnScreen = v;
      if (!A || !A.homeFieldVisible) return;
      if (v === last) return;
      last = v;
      try { A.homeFieldVisible(v); } catch(e){}
    }
    // Native calls this after a tab switch, when this page may already be
    // scrolled but no intersection change will fire on its own.
    window.__syncHomeBar = function(){
      last = null;
      push(f.getBoundingClientRect().bottom > 0);
    };
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function(entries){
        push(entries[0].isIntersecting);
      }, { threshold: 0 }).observe(f);
    } else {
      window.addEventListener('scroll', function(){
        push(f.getBoundingClientRect().bottom > 0);
      }, { passive: true });
    }
    push(true);
  })();

  // ---------- Jump back in ----------
  // The page last read in another tab (SearchApp.getResume), and a tap goes
  // back to that very tab, its history intact (SearchApp.resumeTab). Asked
  // again whenever native says it may have changed (__refreshResume).
  var resumeEl = document.getElementById('resume');
  var resumeKey = '';
  function renderResume(animate){
    var A = bridge();
    if (!resumeEl || !A || !A.getResume || nightOwl) return;
    if (mode === 'zen') { resumeEl.classList.add('hidden'); resumeKey = ''; return; }
    var r = null;
    try { r = JSON.parse(A.getResume() || '{}'); } catch (e) { r = null; }
    if (!r || !r.url || !/^https?:\/\//i.test(r.url)) {
      resumeEl.classList.add('hidden'); resumeKey = ''; return;
    }
    var key = r.id + '|' + r.url + '|' + r.title;
    if (key === resumeKey) return;
    resumeKey = key;
    resumeEl.innerHTML = '';
    var icon = el('span', 'resume-icon', (r.site || '?').charAt(0).toUpperCase());
    var fav = r.domain && A.getCachedFavicon ? A.getCachedFavicon(r.domain) : '';
    if (fav && /^data:image\//.test(fav)) {
      icon.textContent = '';
      var img = document.createElement('img'); img.alt = ''; img.src = fav; icon.appendChild(img);
    }
    var text = el('span', 'resume-text');
    text.appendChild(el('span', 'resume-label', 'Jump back in'));
    text.appendChild(el('span', 'resume-title', r.title || r.site || r.url));
    text.appendChild(el('span', 'resume-site', r.site || ''));
    resumeEl.appendChild(icon); resumeEl.appendChild(text);
    resumeEl.insertAdjacentHTML('beforeend', '<svg class="resume-go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6.5L15 12l-5.5 5.5"/></svg>');
    resumeEl.setAttribute('aria-label', 'Jump back in: ' + (r.title || r.site || ''));
    resumeEl.onclick = function(e){
      e.preventDefault();
      var B = bridge();
      if (B && B.resumeTab) B.resumeTab(String(r.id), r.url);
    };
    resumeEl.classList.remove('hidden');
    if (animate && !reduceMotion) {
      resumeEl.classList.remove('enter'); void resumeEl.offsetWidth; resumeEl.classList.add('enter');
    }
  }
  window.__refreshResume = function(){ renderResume(true); renderShield(); };

  // ---------- A new browsing mode, live ----------
  // The app calls this when the mode changes in Settings: the page
  // recomposes where it is, with no reload. Leaving Explore drops the
  // stories (their pictures stop loading and decoding, nothing more is
  // fetched); coming back to it loads them.
  window.__setMode = function(m, zt){
    var next = (m === 'focus' || m === 'zen') ? m : 'explore';
    var tilesNext = zt === true;
    if (next === mode && tilesNext === zenTiles) return;
    mode = next; zenTiles = tilesNext;
    modeClasses();
    if (!reduceMotion) { wrapEl.classList.remove('modeswap'); void wrapEl.offsetWidth; wrapEl.classList.add('modeswap'); }
    tilesSig = null;
    renderTiles();
    resumeKey = '';
    renderResume(false);
    renderShield();
    if (mode === 'explore') {
      if (!nightOwl) { feedLoaded = false; loadFeed(); }
    } else {
      pendingFeed = null;
      feedReqId++;            // an answer still on its way is not wanted
      renderFeed([]);
    }
    adRep = '';
    reportAdSlotSoon();
  };
  renderResume(true);

  // ---------- Blocked this week ----------
  var shieldEl = document.getElementById('shield');
  function renderShield(){
    var A = bridge();
    if (!shieldEl || !A || !A.getPrivacyStats || nightOwl) return;
    if (mode !== 'explore') { shieldEl.classList.add('hidden'); return; }
    var st = null;
    try { st = JSON.parse(A.getPrivacyStats() || '{}'); } catch (e) { st = null; }
    if (!st || !st.on || !(st.week > 0)) { shieldEl.classList.add('hidden'); return; }
    var n = Number(st.week);
    var shown = n.toLocaleString ? n.toLocaleString() : String(n);
    shieldEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.6-3 8.4-7 10-4-1.6-7-5.4-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>';
    var t = el('span');
    t.appendChild(el('b', null, shown));
    t.appendChild(document.createTextNode(' ads and trackers blocked this week' + (st.saved ? ' \u00B7 about ' + st.saved + ' saved' : '')));
    shieldEl.appendChild(t);
    shieldEl.classList.remove('hidden');
  }
  renderShield();


  // The accent is read once at load, so a change made in Settings has to be
  // pushed into the live page or the page keeps the old colour until reload.
  window.__setAccent = function(hex, hueShift){
    if (hex) applyAccent(hex);
  };
})();
</script>
</body>
