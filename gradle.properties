android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# One JVM for the whole build. Kotlin compiles inside Gradle's process
# (in-process) rather than in a second daemon of its own, and that one process
# gets room for R8 - the release build's shrinker, its hungriest step. With
# 1.5GB for Gradle plus a separate Kotlin daemon, a release build on a
# Codespace ran the machine out of memory and the daemon was killed mid-build
# ("Gradle build daemon disappeared unexpectedly"). ParallelGC has the least
# overhead for a one-off batch JVM.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.daemon=false
org.gradle.workers.max=1
android.r8.optimizedResourceShrinking=true
