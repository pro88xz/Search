[package]
name = "adblock-jni"
version = "1.0.0"
edition = "2021"
publish = false
description = "JNI bridge from the Search browser to Brave's adblock-rust engine"

[lib]
name = "adblock_jni"
crate-type = ["cdylib", "rlib"]

[dependencies]
adblock = { version = "=0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
jni = { version = "0.21", default-features = false }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "unwind"
strip = true
